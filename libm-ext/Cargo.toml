[package]
name = "libm-ext"
description = "libm extension"
categories = ["mathematics"]
keywords = ["math", "scientific", "libm", "extension"]
readme = "README.md"
authors = ["tangxiangong <tangxiangong@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tangxiangong/libm-ext"
version = "0.0.1"
edition = "2024"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "./docs-header.html"]

[lib]
name = "libm_ext"
doctest = false

[dependencies]
libm = "0.2"
